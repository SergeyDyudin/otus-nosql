networks:
  clickhouse-net:

services:
  clickhouse-keeper-01:
    image: "clickhouse/clickhouse-keeper:latest-alpine"
    user: "101:101"
    container_name: clickhouse-keeper-01
    hostname: clickhouse-keeper-01
    volumes:
      - ./config/clickhouse-keeper-01/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
    ports:
      - "127.0.0.1:9181:9181"
    networks:
      - clickhouse-net

  clickhouse-keeper-02:
    image: "clickhouse/clickhouse-keeper:latest-alpine"
    user: "101:101"
    container_name: clickhouse-keeper-02
    hostname: clickhouse-keeper-02
    volumes:
      - ./config/clickhouse-keeper-02/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
    ports:
      - "127.0.0.1:9182:9181"
    networks:
      - clickhouse-net

  clickhouse-keeper-03:
    image: "clickhouse/clickhouse-keeper:latest-alpine"
    user: "101:101"
    container_name: clickhouse-keeper-03
    hostname: clickhouse-keeper-03
    volumes:
      - ./config/clickhouse-keeper-03/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
    ports:
      - "127.0.0.1:9183:9181"
    networks:
      - clickhouse-net

  clickhouse-01:
    image: "clickhouse/clickhouse-server:latest"
    user: "101:101"
    container_name: clickhouse-01
    hostname: clickhouse-01
    volumes:
      - ./config/clickhouse-01/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/clickhouse-01/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    networks:
      - clickhouse-net
    depends_on:
      - clickhouse-keeper-01
      - clickhouse-keeper-02
      - clickhouse-keeper-03

  clickhouse-02:
    image: "clickhouse/clickhouse-server:latest"
    user: "101:101"
    container_name: clickhouse-02
    hostname: clickhouse-02
    volumes:
      - ./config/clickhouse-02/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/clickhouse-02/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9001:9000"
    networks:
      - clickhouse-net
    depends_on:
      - clickhouse-keeper-01
      - clickhouse-keeper-02
      - clickhouse-keeper-03

  clickhouse-03:
    image: "clickhouse/clickhouse-server:latest"
    user: "101:101"
    container_name: clickhouse-03
    hostname: clickhouse-03
    volumes:
      - ./config/clickhouse-03/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/clickhouse-03/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "127.0.0.1:8125:8123"
      - "127.0.0.1:9002:9000"
    networks:
      - clickhouse-net
    depends_on:
      - clickhouse-keeper-01
      - clickhouse-keeper-02
      - clickhouse-keeper-03

  clickhouse-04:
    image: "clickhouse/clickhouse-server:latest"
    user: "101:101"
    container_name: clickhouse-04
    hostname: clickhouse-04
    volumes:
      - ./config/clickhouse-04/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/clickhouse-04/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "127.0.0.1:8126:8123"
      - "127.0.0.1:9003:9000"
    networks:
      - clickhouse-net
    depends_on:
      - clickhouse-keeper-01
      - clickhouse-keeper-02
      - clickhouse-keeper-03

  clickhouse-05:
    image: "clickhouse/clickhouse-server:latest"
    user: "101:101"
    container_name: clickhouse-05
    hostname: clickhouse-05
    volumes:
      - ./config/clickhouse-05/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/clickhouse-05/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "127.0.0.1:8127:8123"
      - "127.0.0.1:9004:9000"
    networks:
      - clickhouse-net
    depends_on:
      - clickhouse-keeper-01
      - clickhouse-keeper-02
      - clickhouse-keeper-03

  clickhouse-06:
    image: "clickhouse/clickhouse-server:latest"
    user: "101:101"
    container_name: clickhouse-06
    hostname: clickhouse-06
    volumes:
      - ./config/clickhouse-06/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/clickhouse-06/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "127.0.0.1:8128:8123"
      - "127.0.0.1:9005:9000"
    networks:
      - clickhouse-net
    depends_on:
      - clickhouse-keeper-01
      - clickhouse-keeper-02
      - clickhouse-keeper-03

  yandex-tank:
    build:
      context: ./tank
    container_name: yandex-tank
    volumes:
      - ./tank/load_rampup.yaml:/tank/load_rampup.yaml:ro
      - ./tank/load_degradation.yaml:/tank/load_degradation.yaml:ro
      - ./results:/tank/logs
    networks:
      - clickhouse-net
    profiles:
      - tank
