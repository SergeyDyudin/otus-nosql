# UI
  compass:
    image: haohanyang/compass-web
    container_name: mongo-compass
    environment:
      - CW_MONGO_URI=mongodb://mongo-router-1:27017
    depends_on:
      - mongo-router-1
    ports:
      - 8080:8080
    links:
      - mongo-router-1
    networks:
      - test

networks:
  test:
    driver: bridge

volumes:
  mongodb_data:
